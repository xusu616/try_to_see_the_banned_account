name: Verify public profile card

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing profile request issue number to verify again
        required: true
        type: string

permissions: {}

jobs:
  validate:
    if: >-
      github.repository == 'xusu616/try_to_see_the_banned_account' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'Verify profile: ') &&
      contains(github.event.issue.body, '<!-- profile-card-request -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
    outputs:
      valid: ${{ steps.request.outputs.valid }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate request before installing a browser
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_profile.py --validate

  verify:
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: profile-card-release-v0.1.1
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install normal Chromium browser
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Update release, hover public contributor, and publish result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_profile.py
