name: Publish CLI release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tool-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package and test
        run: |
          python3 scripts/package_tool.py
          python3 dist/find-profile-cards.pyz --help
          status=0
          python3 dist/find-profile-cards.pyz example >/dev/null 2>&1 || status=$?
          test "$status" -eq 2
          cd dist
          sha256sum --check find-profile-cards.pyz.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          tag_path=$(python3 -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "$tag")
          remote_sha=$(gh api "repos/$GH_REPO/commits/tags/$tag_path" --jq .sha)
          if [[ "$remote_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "The tag points to a different commit now."
            exit 1
          fi

          marker='<!-- cli-release-workflow -->'
          if ! release=$(gh release view "$tag" --json isDraft,body,assets); then
            # A failed create may have left a draft, or another publisher may have won the race.
            if ! gh release create "$tag" --verify-tag --draft --title "$tag" --generate-notes --notes "$marker"; then
              echo "Checking for an existing release after the create attempt."
            fi
            release=$(gh release view "$tag" --json isDraft,body,assets)
          fi

          if jq -e --arg marker "$marker" '.isDraft and (.body // "" | contains($marker) | not)' <<< "$release" >/dev/null; then
            echo "An existing draft already uses this tag."
            exit 1
          fi

          existing=$(mktemp -d)
          for asset in dist/find-profile-cards.pyz dist/find-profile-cards.pyz.sha256; do
            name="${asset##*/}"
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null; then
              if gh release upload "$tag" "$asset"; then
                continue
              fi
            fi
            gh release download "$tag" --pattern "$name" --dir "$existing"
            if ! cmp -s "$asset" "$existing/$name"; then
              echo "The release already contains a different $name."
              exit 1
            fi
          done

          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            gh release edit "$tag" --verify-tag --draft=false
          fi
