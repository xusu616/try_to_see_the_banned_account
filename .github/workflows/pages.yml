name: Profile cards on GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Verify public profile card]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test card builder
        run: python -m unittest discover -s tests
      - name: Build static site
        run: python scripts/build_pages.py --output "$RUNNER_TEMP/profile-cards"
      - name: Restore verified-profile database
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/profiles.sqlite
          key: profile-index-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: profile-index-v3-
      - name: Sync only comments changed since the previous build
        if: github.event_name != 'pull_request'
        id: profile-index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.profile_index --database "$RUNNER_TEMP/profiles.sqlite" --output "$RUNNER_TEMP/profile-cards" --sync
      - name: Install Chromium for old biography migration
        if: steps.profile-index.outputs.needs_bio_refresh == 'true'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Re-read old biographies from existing release contributors
        if: steps.profile-index.outputs.needs_bio_refresh == 'true'
        run: python -m scripts.profile_index --database "$RUNNER_TEMP/profiles.sqlite" --output "$RUNNER_TEMP/profile-cards" --refresh-bios
      - name: Save verified-profile database
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/profiles.sqlite
          key: profile-index-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview
          path: ${{ runner.temp }}/profile-cards
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/profile-cards

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
