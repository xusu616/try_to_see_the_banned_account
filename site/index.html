<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="输入 GitHub 用户名，实时核验 Release 页中的公开资料卡。">
  <title>GitHub 资料卡查询</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="./" aria-label="资料卡查询首页">
        <span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        GitHub 封禁账号 资料卡查询
      </a>
      <a class="source-link" href="https://github.com/xusu616/try_to_see_the_banned_account" target="_blank" rel="noopener">项目源码</a>
    </div>
    <div class="lookup-panel">
      <section class="lookup" aria-labelledby="lookup-heading">
        <h2 id="lookup-heading" style="display: inline;">
          查询 GitHub 用户
        </h2>
        <h5 class="lookup-subheading" style="display: inline; font-weight: 400;">
          <s>其实你也可以通过时光机之类的办法来查看...?可能在GitHub上面看到自己的账号会更宽心吧（（？</s>
        </h5>
        <form id="lookup-form" role="search">
          <label for="github-login">GitHub 用户名</label>
          <div class="input-row">
            <div class="input-wrap"><span aria-hidden="true">@</span><input id="github-login" name="login" placeholder="例如 rD227" maxlength="42" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-describedby="submit-hint" required></div>
            <button id="lookup-button" type="submit">查询资料卡</button>
          </div>
          <p class="hint" id="submit-hint"></p>
        </form>
      </section>
      <section id="result-section" class="result-section" aria-label="查询结果" hidden>
        <div id="request-status" class="request-status" data-state="waiting" role="status" aria-live="polite" aria-atomic="true">
          <span class="status-dot" aria-hidden="true"></span>
          <div><p id="status-title"></p><p id="status-detail" class="status-detail"></p></div>
        </div>
        <div id="current-card" class="current-card" aria-label="当前查询的资料卡"></div>
        <div class="request-actions">
          <a id="submit-link" class="text-action" target="_blank" rel="noopener" hidden>前往 GitHub 提交核验</a>
          <a id="issue-link" class="text-action" target="_blank" rel="noopener" hidden>查看查询请求</a>
          <button id="resume-button" class="soft-button" type="button" hidden>检查提交结果</button>
        </div>
        <p id="submit-privacy" class="hint" hidden>提交核验需要登录 GitHub，用户名和请求将公开为 Issue。</p>
      </section>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="page-heading">
      <p class="eyebrow">GITHUB 公开资料卡</p>
      <h1 id="page-heading">英灵殿</h1>
      <p class="intro">这里收录主页返回 404、且资料卡核验成功的账号</p>
      <h3 class="intro">点击查看 release 来源，电脑中悬浮在头像框上面可以follow噢</h3>
    </section>
    <section class="card-gallery" aria-labelledby="gallery-heading">
      <div class="gallery-heading"><h2 id="gallery-heading">已收录的账号</h2></div>
      <div id="recent-cards" class="card-list"></div>
      <div class="gallery-notice">
        <p id="gallery-status" class="hint" role="status" aria-live="polite">正在读取已核验账号…</p>
        <button id="gallery-retry" class="soft-button" type="button" hidden>重新读取账号列表</button>
      </div>
      <div id="card-result" class="card-list"></div>
    </section>
    <p class="source-note">每张卡片均可打开对应的 Release 来源。结果仅表示核验时的可见情况。</p>
    <nav id="card-pagination" class="pagination" aria-label="账号卡片分页">
      <button id="previous-page" class="soft-button" type="button" disabled>上一页</button>
      <label for="page-select">页码</label>
      <select id="page-select" disabled><option value="1">第 1 页</option></select>
      <span id="page-summary" role="status" aria-live="polite">第 1 页</span>
      <button id="next-page" class="soft-button" type="button" disabled>下一页</button>
    </nav>
  </main>
  <template id="card-template">
    <article class="profile-card">
      <div class="profile-identity">
        <div class="avatar-frame">
          <span class="avatar-initial" aria-hidden="true"></span>
          <img width="72" height="72" alt="" referrerpolicy="no-referrer" hidden>
        </div>
        <div class="identity-text"><h2 class="profile-name"></h2><p class="profile-login"></p></div>
        <span class="profile-badge" hidden></span>
      </div>
      <p class="profile-bio" hidden></p>
      <div class="profile-source">
        <div class="profile-actions">
          <a class="profile-source-link" target="_blank" rel="noopener"></a>
          <a class="card-request-link" target="_blank" rel="noopener" hidden>查看查询请求</a>
        </div>
        <time></time>
      </div>
    </article>
  </template>
</body>
</html>
