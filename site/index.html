<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="输入 GitHub 用户名，实时核验 Release 页中的公开资料卡。">
  <title>GitHub 资料卡查询</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="./" aria-label="资料卡查询首页">
        <span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        资料卡查询
      </a>
      <a class="source-link" href="https://github.com/xusu616/try_to_see_the_banned_account" target="_blank" rel="noopener">项目源码</a>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="page-heading">
      <p class="eyebrow">GITHUB 公开资料卡</p>
      <h1 id="page-heading">输入用户名，<br>看看资料卡。</h1>
      <p class="intro">实时核验 GitHub Release 原页中的公开资料。核验成功后，在这里查看头像、名称和简介。</p>
    </section>
    <section class="lookup" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading">查询 GitHub 用户</h2>
      <form id="lookup-form" role="search">
        <label for="github-login">GitHub 用户名</label>
        <div class="input-row">
          <div class="input-wrap"><span aria-hidden="true">@</span><input id="github-login" name="login" placeholder="例如 rD227" maxlength="42" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-describedby="submit-hint" required></div>
          <button id="lookup-button" type="submit">查询资料卡</button>
        </div>
        <p class="hint" id="submit-hint">将在 GitHub 确认提交一次，随后自动等待结果。</p>
        <p class="hint privacy-hint">需登录 GitHub；用户名和查询请求将作为公开 Issue 发布。</p>
      </form>
    </section>
    <section id="result-section" class="result-section" aria-label="查询结果" hidden>
      <div id="request-status" class="request-status" data-state="waiting" role="status" aria-live="polite" aria-atomic="true">
        <span class="status-dot" aria-hidden="true"></span>
        <div><p id="status-title"></p><p id="status-detail" class="status-detail"></p></div>
      </div>
      <div class="request-actions">
        <a id="submit-link" class="text-action" target="_blank" rel="noopener" hidden>打开 GitHub 提交页面</a>
        <a id="issue-link" class="text-action" target="_blank" rel="noopener" hidden>查看查询请求</a>
        <button id="share-button" class="soft-button" type="button" hidden>复制结果链接</button>
        <button id="resume-button" class="soft-button" type="button" hidden>继续等待</button>
      </div>
      <p id="share-status" class="hint" role="status" hidden></p>
      <div id="card-result"></div>
    </section>
    <p class="source-note">核验来源：<a href="https://github.com/xusu616/try_to_see_the_banned_account/releases/tag/v0.1.1" target="_blank" rel="noopener">Release v0.1.1</a><br>结果仅表示本次来源页的可见情况。</p>
  </main>
  <template id="card-template">
    <article class="profile-card">
      <div class="profile-identity">
        <div class="avatar-frame">
          <span class="avatar-initial" aria-hidden="true"></span>
          <img width="72" height="72" alt="" referrerpolicy="no-referrer" hidden>
        </div>
        <div class="identity-text"><h2 class="profile-name"></h2><p class="profile-login"></p></div>
        <span class="profile-badge" hidden></span>
      </div>
      <p class="profile-bio" hidden></p>
      <div class="profile-source">
        <a class="release-link" href="https://github.com/xusu616/try_to_see_the_banned_account/releases/tag/v0.1.1" target="_blank" rel="noopener">查看 Release 原页</a>
        <time></time>
      </div>
    </article>
  </template>
</body>
</html>
